
name: Build SERumah Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: serumah-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SERumah APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract SERumah fix package
        run: |
          if [ -f SERumah-Fix-v1.zip ]; then
            unzip -o SERumah-Fix-v1.zip -d /tmp/serumah-fix
            cp -a /tmp/serumah-fix/SERumah-Android/. .
          else
            echo "SERumah-Fix-v1.zip tidak ditemukan"
            exit 1
          fi

      - name: Verify project files
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f resources/icon.png
          test -f www/index.html
          echo "Project files verified"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply Android settings
        run: |
          if [ -f android-overrides/res/drawable/ic_stat_serumah.xml ]; then
            mkdir -p android/app/src/main/res/drawable
            cp android-overrides/res/drawable/ic_stat_serumah.xml android/app/src/main/res/drawable/
          fi

          if [ -f scripts/patch-manifest.py ]; then
            python3 scripts/patch-manifest.py android/app/src/main/AndroidManifest.xml
          fi

      - name: Generate launcher icons
        run: npx --yes @capacitor/assets@latest generate --android --assetPath resources

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: serumah-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

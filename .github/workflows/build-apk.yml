name: Build SERumah Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: serumah-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SERumah APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply native feature package
        run: |
          set -e
          test -f SERumah-Android-Native-Fix.zip
          mkdir -p /tmp/serumah-native-fix
          unzip -o SERumah-Android-Native-Fix.zip -d /tmp/serumah-native-fix
          cp -a /tmp/serumah-native-fix/android-overrides/. android-overrides/
          cp /tmp/serumah-native-fix/scripts/patch-manifest.py scripts/patch-manifest.py

      - name: Verify source files
        run: |
          set -e
          test -f package.json
          test -f capacitor.config.json
          test -f resources/icon.png
          test -f www/index.html
          test -f android-overrides/app/src/main/java/id/satuproyeksi/serumah/MainActivity.java
          ! grep -q '"@capacitor/nfc"' package.json
          ! grep -q '"@capgo/capacitor-nfc"' package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Install native plugin sources
        run: |
          set -e
          mkdir -p android/app/src/main/java/id/satuproyeksi/serumah
          cp android-overrides/app/src/main/java/id/satuproyeksi/serumah/*.java android/app/src/main/java/id/satuproyeksi/serumah/
          python3 scripts/patch-manifest.py android/app/src/main/AndroidManifest.xml
          if [ -f android-overrides/res/drawable/ic_stat_serumah.xml ]; then
            mkdir -p android/app/src/main/res/drawable
            cp android-overrides/res/drawable/ic_stat_serumah.xml android/app/src/main/res/drawable/
          fi

      - name: Generate launcher icons
        run: npx --yes @capacitor/assets@latest generate --android --assetPath resources

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: serumah-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
